[project]
name = "cuotiben-backend"
version = "0.1.0"
description = "错题本系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9", "onnxruntime>=1.18"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 默认不跑 integration；命令行传 -m integration 时后者覆盖前者
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: 需要真实 OCR 引擎等外部依赖，默认不运行"]

[tool.ruff]
line-length = 100
target-version = "py311"
